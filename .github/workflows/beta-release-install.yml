name: Published beta installer

on:
  pull_request:
    paths:
      - .github/workflows/beta-release-install.yml
      - README.md
      - scripts/README.md
      - action/setup/README.md
      - docs/launch-plan.md
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: beta-release-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Published beta install / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            system: Linux/x86_64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            system: Linux/aarch64
          - name: macOS arm64
            runner: macos-26
            system: Darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-beta.3
      SOURCE_SHA: d99e6f685b5db878b924181926399c57be9f16d7
      QA_SOURCE_SHA: 8990f7dd8e662c3aeebbc4a0ff9bccc03cb1d820
      RELEASE_REPOSITORY: ziahamza/layercache
    steps:
      # The workflow is reviewed on this PR; the script comes from the exact
      # commit that published the release, independent of PR branch contents.
      - name: Check out the published installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ziahamza/layercache
          ref: d99e6f685b5db878b924181926399c57be9f16d7
          persist-credentials: false

      - name: Check published release and exact source commit
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = '${{ matrix.system }}'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          release="$(gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == false and
            .prerelease == true and .immutable == true
          ' <<<"$release" >/dev/null
          tag="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -er '.object.type' <<<"$tag")"
          object_sha="$(jq -er '.object.sha' <<<"$tag")"
          for _ in {1..16}; do
            if [[ "$object_type" == commit ]]; then
              break
            fi
            test "$object_type" = tag
            tag="$(gh api "repos/$RELEASE_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag")"
            object_sha="$(jq -er '.object.sha' <<<"$tag")"
          done
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"

      - name: Install the published beta into a fresh runner prefix
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/layercache-beta-install"
          test ! -e "$prefix"
          bash scripts/install.sh \
            --repository "$RELEASE_REPOSITORY" \
            --version "$RELEASE_TAG" \
            --prefix "$prefix"
          test -x "$prefix/layercache"
          "$prefix/layercache" help >"$RUNNER_TEMP/layercache-help.txt"
          grep -F 'serve-cloud' "$RUNNER_TEMP/layercache-help.txt"
          grep -F 'connect' "$RUNNER_TEMP/layercache-help.txt"
          "$prefix/layercache" setup \
            --config "$RUNNER_TEMP/layercache-beta-preview.json" \
            --project github.com/ziahamza/layercache \
            --data-dir "$RUNNER_TEMP/layercache-beta-preview-data" \
            --max-size 1073741824 \
            --min-free-bytes 5368709120 \
            --preview --json >"$RUNNER_TEMP/layercache-preview.json"
          jq -e '
            .preview == true and .configured == false and
            .projectId == "github.com/ziahamza/layercache" and
            .maxBytes == 1073741824
          ' "$RUNNER_TEMP/layercache-preview.json" >/dev/null
          test ! -e "$RUNNER_TEMP/layercache-beta-preview.json"

      # Keep the immutable installer source separate from the reviewed QA
      # harness, whose metadata deadlines now match ordinary runtime latency.
      - name: Check out the reviewed acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ziahamza/layercache
          ref: 8990f7dd8e662c3aeebbc4a0ff9bccc03cb1d820
          path: qualification-source
          persist-credentials: false

      - name: Verify the acceptance source
        run: test "$(git -C qualification-source rev-parse HEAD)" = "$QA_SOURCE_SHA"

      - name: Set up Node.js for installed-binary Turbo acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13.0"

      - name: Install the locked real Turbo client
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir qualification-source/qa/fixtures/local-ci-reuse install --frozen-lockfile

      - name: Prove successful local tasks restore using the published binary
        run: |
          set -euo pipefail
          legacy_flags=()
          if [[ "$RELEASE_TAG" == v0.1.0-beta.3 ]]; then
            legacy_flags+=(--allow-legacy-conflict-pins)
          fi
          python3 qualification-source/qa/local-ci-reuse/run.py \
            --binary "$RUNNER_TEMP/layercache-beta-install/layercache" \
            --turbo "$GITHUB_WORKSPACE/qualification-source/qa/fixtures/local-ci-reuse/node_modules/.bin/turbo" \
            "${legacy_flags[@]}" \
            --output "$RUNNER_TEMP/beta3-local-ci-reuse.json"
          jq -e '
            .schemaVersion == "local-ci-reuse-v1" and .passed == true and
            (.scenarios | length) == 17
          ' "$RUNNER_TEMP/beta3-local-ci-reuse.json" >/dev/null

      - name: Preserve installed-binary reuse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta3-local-ci-reuse-${{ matrix.name }}
          path: ${{ runner.temp }}/beta3-local-ci-reuse.json
          if-no-files-found: warn
          retention-days: 30
