name: Published beta installer

on:
  pull_request:
    paths:
      - .github/workflows/beta-release-install.yml
      - scripts/README.md
      - action/setup/README.md
      - action/turbo/README.md
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: beta-release-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Published beta install / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            system: Linux/x86_64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            system: Linux/aarch64
          - name: macOS arm64
            runner: macos-26
            system: Darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-beta.5
      SOURCE_SHA: 53ec27443a406a508b7e8faeab3f46292e0ba07b
      RELEASE_REPOSITORY: ziahamza/layercache
    steps:
      # The workflow is reviewed on this PR; the script comes from the exact
      # commit that published the release, independent of PR branch contents.
      - name: Check out the published installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ziahamza/layercache
          ref: 53ec27443a406a508b7e8faeab3f46292e0ba07b
          persist-credentials: false

      - name: Check published release and exact source commit
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = '${{ matrix.system }}'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          release="$(gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == false and
            .prerelease == true and .immutable == true
          ' <<<"$release" >/dev/null
          tag="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -er '.object.type' <<<"$tag")"
          object_sha="$(jq -er '.object.sha' <<<"$tag")"
          for _ in {1..16}; do
            if [[ "$object_type" == commit ]]; then
              break
            fi
            test "$object_type" = tag
            tag="$(gh api "repos/$RELEASE_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag")"
            object_sha="$(jq -er '.object.sha' <<<"$tag")"
          done
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"

      - name: Install the published beta into a fresh runner prefix
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/layercache-beta-install"
          test ! -e "$prefix"
          bash scripts/install.sh \
            --repository "$RELEASE_REPOSITORY" \
            --version "$RELEASE_TAG" \
            --prefix "$prefix"
          test -x "$prefix/layercache"
          "$prefix/layercache" help >"$RUNNER_TEMP/layercache-help.txt"
          grep -F 'serve-cloud' "$RUNNER_TEMP/layercache-help.txt"
          grep -F 'connect' "$RUNNER_TEMP/layercache-help.txt"
          "$prefix/layercache" setup \
            --config "$RUNNER_TEMP/layercache-beta-preview.json" \
            --project github.com/ziahamza/layercache \
            --data-dir "$RUNNER_TEMP/layercache-beta-preview-data" \
            --max-size 1073741824 \
            --min-free-bytes 5368709120 \
            --preview --json >"$RUNNER_TEMP/layercache-preview.json"
          jq -e '
            .preview == true and .configured == false and
            .projectId == "github.com/ziahamza/layercache" and
            .maxBytes == 1073741824
          ' "$RUNNER_TEMP/layercache-preview.json" >/dev/null
          test ! -e "$RUNNER_TEMP/layercache-beta-preview.json"

      - name: Set up Node.js for installed-binary acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13.0"

      # Only the QA credential helper is compiled. All cache traffic uses the
      # installed, provenance-verified release binary.
      - name: Set up Go for the Nx QA credential helper
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: false

      - name: Install the locked real Turbo client
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir qa/fixtures/local-ci-reuse install --frozen-lockfile

      - name: Prove successful local tasks restore using the published binary
        run: |
          set -euo pipefail
          python3 qa/local-ci-reuse/run.py \
            --binary "$RUNNER_TEMP/layercache-beta-install/layercache" \
            --turbo "$GITHUB_WORKSPACE/qa/fixtures/local-ci-reuse/node_modules/.bin/turbo" \
            --output "$RUNNER_TEMP/beta5-local-ci-reuse.json"
          jq -e '
            .schemaVersion == "local-ci-reuse-v1" and .passed == true and
            (.scenarios | length) == 17
          ' "$RUNNER_TEMP/beta5-local-ci-reuse.json" >/dev/null

      - name: Prove native Nx replay using the published binary
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-beta-install/layercache
          NX_QA_OUTPUT: ${{ runner.temp }}/beta5-nx-native.json
        run: node qa/nx-native/run.mjs

      - name: Qualify native Gradle HTTP caching using the published binary
        id: gradle-native
        if: matrix.system == 'Linux/x86_64'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-beta-install/layercache
          GRADLE_QA_OUTPUT: ${{ runner.temp }}/beta5-gradle-native.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 10 --max-time 120 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output "$RUNNER_TEMP/gradle-native.zip"
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  $RUNNER_TEMP/gradle-native.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-native.zip" -d "$RUNNER_TEMP/gradle-native"
          export JAVA_HOME="${JAVA_HOME_17_X64:?The native fixture requires JDK 17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_BIN="$RUNNER_TEMP/gradle-native/gradle-9.3.1/bin/gradle"
          node qa/gradle-native/run.mjs
          binary_digest="sha256:$(sha256sum "$LAYERCACHE_BIN" | cut -d ' ' -f 1)"
          init_digest="sha256:$(sha256sum native/gradle/init.gradle | cut -d ' ' -f 1)"
          jq -e --arg source "$SOURCE_SHA" \
            --arg binary "$binary_digest" --arg init "$init_digest" '
            .schemaVersion == "gradle-native-v1" and .passed == true and
            .sourceRevision == $source and .binaryDigest == $binary and
            .initScriptDigest == $init and .gradleVersion == "9.3.1" and
            (.stages | length) == 22
          ' "$GRADLE_QA_OUTPUT" >/dev/null

      - name: Preserve installed Gradle qualification evidence
        if: always() && steps.gradle-native.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta5-installed-gradle-${{ matrix.name }}
          path: ${{ runner.temp }}/beta5-gradle-native.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve installed-binary reuse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta5-installed-reuse-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/beta5-local-ci-reuse.json
            ${{ runner.temp }}/beta5-nx-native.json
          if-no-files-found: warn
          retention-days: 30
