name: Published beta installer

on:
  pull_request:
    paths:
      - .github/workflows/beta-release-install.yml
      - scripts/README.md
      - scripts/install.sh
      - scripts/install.test.mjs
      - scripts/verify-release-provenance.sh
      - scripts/provenance/**
      - action/setup/README.md
      - action/turbo/README.md
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published immutable beta tag to qualify.
        type: string
        required: true
        default: v0.1.0-beta.9
      source_sha:
        description: Exact 40-character source commit already published at that tag.
        type: string
        required: true
        default: cb254e9af694f6fe25f5a0ad416456174bda3e44
      native_bundle_sha256:
        description: SHA256 of native/dist/cli.js from that same source commit.
        type: string
        required: true
        default: 2dc950d2bda8eb6b5d74be3e8f5b378c83e4c25343b554f976ee1aceca36fee8

permissions:
  contents: read
  attestations: read

concurrency:
  group: beta-release-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Published beta install / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            system: Linux/x86_64
            goos: linux
            goarch: amd64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            system: Linux/aarch64
            goos: linux
            goarch: arm64
          - name: macOS arm64
            runner: macos-26
            system: Darwin/arm64
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.1.0-beta.9' }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || 'cb254e9af694f6fe25f5a0ad416456174bda3e44' }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      NATIVE_BUNDLE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.native_bundle_sha256 || '2dc950d2bda8eb6b5d74be3e8f5b378c83e4c25343b554f976ee1aceca36fee8' }}
    steps:
      - name: Validate exact release qualification pins before checkout
        run: |
          set -euo pipefail
          test "${#RELEASE_TAG}" -le 80
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NATIVE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      # Native harnesses use the published source. The installer and its
      # provenance policy use this reviewed workflow's source, so a repository
      # transfer can be qualified without changing an immutable old release.
      - name: Check out the published installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Check out the reviewed installer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .local/release-installer
          persist-credentials: false

      - name: Check published release and exact source commit
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = '${{ matrix.system }}'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          release="$(gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == false and
            .prerelease == true and .immutable == true
          ' <<<"$release" >/dev/null
          tag="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -er '.object.type' <<<"$tag")"
          object_sha="$(jq -er '.object.sha' <<<"$tag")"
          for _ in {1..16}; do
            if [[ "$object_type" == commit ]]; then
              break
            fi
            test "$object_type" = tag
            tag="$(gh api "repos/$RELEASE_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag")"
            object_sha="$(jq -er '.object.sha' <<<"$tag")"
          done
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"

      - name: Install the published beta into a fresh runner prefix
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/layercache-beta-install"
          test ! -e "$prefix"
          bash .local/release-installer/scripts/install.sh \
            --repository "$RELEASE_REPOSITORY" \
            --version "$RELEASE_TAG" \
            --prefix "$prefix"
          test -x "$prefix/layercache"
          "$prefix/layercache" help >"$RUNNER_TEMP/layercache-help.txt"
          grep -F 'serve-cloud' "$RUNNER_TEMP/layercache-help.txt"
          grep -F 'connect' "$RUNNER_TEMP/layercache-help.txt"
          "$prefix/layercache" setup \
            --config "$RUNNER_TEMP/layercache-beta-preview.json" \
            --project github.com/ziahamza/layercache \
            --data-dir "$RUNNER_TEMP/layercache-beta-preview-data" \
            --max-size 1073741824 \
            --min-free-bytes 5368709120 \
            --preview --json >"$RUNNER_TEMP/layercache-preview.json"
          jq -e '
            .preview == true and .configured == false and
            .projectId == "github.com/ziahamza/layercache" and
            .maxBytes == 1073741824
          ' "$RUNNER_TEMP/layercache-preview.json" >/dev/null
          test ! -e "$RUNNER_TEMP/layercache-beta-preview.json"

      - name: Set up Node.js for installed-binary acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13.0"

      # Only acceptance harnesses and the QA credential helper are compiled.
      # Services and lifecycle operations use the provenance-verified binary.
      - name: Set up Go for installed-binary acceptance harnesses
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: false

      - name: Verify installed binary provenance and source revision
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/layercache-beta-install/layercache"
          bash .local/release-installer/scripts/verify-release-provenance.sh \
            "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$SOURCE_SHA" "$binary"
          go version -m "$binary" >"$RUNNER_TEMP/beta-go-build-metadata.txt"
          awk -v revision="vcs.revision=$SOURCE_SHA" \
            -v goos="GOOS=$EXPECTED_GOOS" -v goarch="GOARCH=$EXPECTED_GOARCH" '
            $1 == "build" && $2 == "vcs=git" { git++ }
            $1 == "build" && $2 == revision { revision_count++ }
            $1 == "build" && $2 == "vcs.modified=false" { clean++ }
            $1 == "build" && $2 == goos { os_count++ }
            $1 == "build" && $2 == goarch { arch_count++ }
            $1 == "build" && $2 == "CGO_ENABLED=0" { cgo_count++ }
            END { exit !(git == 1 && revision_count == 1 && clean == 1 &&
                         os_count == 1 && arch_count == 1 && cgo_count == 1) }
          ' "$RUNNER_TEMP/beta-go-build-metadata.txt"
          test "$(shasum -a 256 native/dist/cli.js | awk '{print $1}')" = "$NATIVE_BUNDLE_SHA256"

      - name: Check installer and setup integrity with the installed binary
        env:
          LAYERCACHE_SETUP_BINARY: ${{ runner.temp }}/layercache-beta-install/layercache
        run: node --test action/setup/setup.test.mjs action/gradle/*.test.mjs .local/release-installer/scripts/install.test.mjs

      - name: Install the locked real Turbo client
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir qa/fixtures/local-ci-reuse install --frozen-lockfile

      - name: Prove successful local tasks restore using the published binary
        run: |
          set -euo pipefail
          python3 qa/local-ci-reuse/run.py \
            --binary "$RUNNER_TEMP/layercache-beta-install/layercache" \
            --turbo "$GITHUB_WORKSPACE/qa/fixtures/local-ci-reuse/node_modules/.bin/turbo" \
            --output "$RUNNER_TEMP/beta-local-ci-reuse.json"
          jq -e '
            .schemaVersion == "local-ci-reuse-v1" and .passed == true and
            (.scenarios | length) == 17
          ' "$RUNNER_TEMP/beta-local-ci-reuse.json" >/dev/null

      - name: Prove native Nx replay using the published binary
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-beta-install/layercache
          NX_QA_OUTPUT: ${{ runner.temp }}/beta-nx-native.json
        run: node qa/nx-native/run.mjs

      - name: Qualify standalone lifecycle and scoped archives using the published binary
        id: xcode-lifecycle
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-beta-install/layercache
          NATIVE_CACHE_CLI: ${{ github.workspace }}/native/dist/cli.js
          LAYER_CACHE_XCODE_LIFECYCLE_REPORT: ${{ runner.temp }}/beta-xcode-lifecycle/receipt.json
          GOMAXPROCS: "2"
          INSTALLER_PLATFORM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/beta-xcode-lifecycle"
          test -x "$LAYERCACHE_BIN"
          test -f "$NATIVE_CACHE_CLI"
          test ! -e "$LAYER_CACHE_XCODE_LIFECYCLE_REPORT"
          git ls-files --error-unmatch native/dist/cli.js >/dev/null
          git diff --quiet -- native/dist/cli.js
          test "$(shasum -a 256 "$NATIVE_CACHE_CLI" | awk '{print $1}')" = "$NATIVE_BUNDLE_SHA256"
          go test ./qa/xcode-lifecycle \
            -run '^TestScopedClosedStoreRoundTrip$' -count=1 -timeout=4m -v
          binary_digest="$(shasum -a 256 "$LAYERCACHE_BIN" | awk '{print $1}')"
          bundle_digest="$(shasum -a 256 "$NATIVE_CACHE_CLI" | awk '{print $1}')"
          jq -e --arg binary "$binary_digest" --arg bundle "$bundle_digest" '
            .version == 1 and .passed == true and
            (.checks | length) == 24 and
            .goBinarySha256 == $binary and
            .nativeBundleSha256 == $bundle and
            .archiveBytes > 0 and .nativeCompilation == false
          ' "$LAYER_CACHE_XCODE_LIFECYCLE_REPORT" >/dev/null
          jq --arg source "$SOURCE_SHA" --arg release "$RELEASE_TAG" \
            --arg platform "$INSTALLER_PLATFORM" '
            . + {sourceRevision:$source,releaseTag:$release,platform:$platform,
                 installedBinary:true,
                 boundary:"loopback lifecycle and scoped archives; synthetic CAS; no native compilation or Apple-managed build"}
          ' "$LAYER_CACHE_XCODE_LIFECYCLE_REPORT" \
            >"$RUNNER_TEMP/beta-installed-xcode-lifecycle.json"

      - name: Preserve installed lifecycle and scoped archive evidence
        if: always() && steps.xcode-lifecycle.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-installed-xcode-lifecycle-${{ matrix.name }}
          path: ${{ runner.temp }}/beta-installed-xcode-lifecycle.json
          if-no-files-found: error
          retention-days: 30

      - name: Qualify native Gradle HTTP caching using the published binary
        id: gradle-native
        if: matrix.system == 'Linux/x86_64'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-beta-install/layercache
          GRADLE_QA_OUTPUT: ${{ runner.temp }}/beta-gradle-native.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 10 --max-time 120 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output "$RUNNER_TEMP/gradle-native.zip"
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  $RUNNER_TEMP/gradle-native.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-native.zip" -d "$RUNNER_TEMP/gradle-native"
          export JAVA_HOME="${JAVA_HOME_17_X64:?The native fixture requires JDK 17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_BIN="$RUNNER_TEMP/gradle-native/gradle-9.3.1/bin/gradle"
          node qa/gradle-native/run.mjs
          binary_digest="sha256:$(sha256sum "$LAYERCACHE_BIN" | cut -d ' ' -f 1)"
          init_digest="sha256:$(sha256sum native/gradle/init.gradle | cut -d ' ' -f 1)"
          jq -e --arg source "$SOURCE_SHA" \
            --arg binary "$binary_digest" --arg init "$init_digest" '
            .schemaVersion == "gradle-native-v1" and .passed == true and
            .sourceRevision == $source and .binaryDigest == $binary and
            .initScriptDigest == $init and .gradleVersion == "9.3.1" and
            (.stages | length) == 22
          ' "$GRADLE_QA_OUTPUT" >/dev/null

      - name: Preserve installed Gradle qualification evidence
        if: always() && steps.gradle-native.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-installed-gradle-${{ matrix.name }}
          path: ${{ runner.temp }}/beta-gradle-native.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve installed-binary reuse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-installed-reuse-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/beta-local-ci-reuse.json
            ${{ runner.temp }}/beta-nx-native.json
          if-no-files-found: warn
          retention-days: 30
