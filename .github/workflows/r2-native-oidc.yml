name: Hosted native Turbo acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish on the default branch, then restore on a non-default branch.
        type: choice
        options: [producer, reader]
        required: true
      sample:
        description: A new 32-character lowercase hex label. Reuse it only for the paired reader.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: r2-native-oidc-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  native-turbo:
    if: >-
      vars.LAYERCACHE_R2_QA_ENABLED == 'true' &&
      vars.LAYERCACHE_R2_QA_ORIGIN != '' &&
      ((inputs.mode == 'producer' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (inputs.mode == 'reader' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      R2_QA_MODE: ${{ inputs.mode }}
      R2_QA_SAMPLE: ${{ inputs.sample }}
      R2_QA_ENABLED: ${{ vars.LAYERCACHE_R2_QA_ENABLED }}
      R2_QA_ORIGIN: ${{ vars.LAYERCACHE_R2_QA_ORIGIN }}
      # This opaque selector is not a credential. A repository secret keeps it
      # out of the public runner's env/with display before masking is possible.
      R2_QA_PROJECT: ${{ secrets.LAYERCACHE_R2_QA_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
      - name: Install the locked native client
        run: |
          npm install --global --ignore-scripts pnpm@10.34.5
          pnpm --dir qa/fixtures/local-ci-reuse install --frozen-lockfile
      - name: Check credential-free failure and redaction controls
        run: node --test qa/r2-native-oidc/run.test.mjs
      - name: Require explicit operator opt-in and the correct signed source ref
        id: prepare
        run: node qa/r2-native-oidc/run.mjs prepare
      - name: Exchange real GitHub OIDC through the pinned native action
        uses: layercompute/layercache/action/turbo@7b5861df3db72882b4122dd66af5e87bb37a625e
        with:
          team-url: ${{ vars.LAYERCACHE_R2_QA_ORIGIN }}
          project: ${{ secrets.LAYERCACHE_R2_QA_PROJECT }}
          compatibility: ${{ steps.prepare.outputs.compatibility }}
          ttl-minutes: '10'
          cache-mode: ${{ inputs.mode == 'producer' && 'read-write' || 'read-only' }}
          working-directory: .layercache-r2-qa
      - name: Qualify real native tasks and server-enforced authority
        run: node qa/r2-native-oidc/run.mjs run
      - name: Preserve only the sanitized public summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-native-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-native-public-summary.json
          if-no-files-found: ignore
          retention-days: 14
