name: Xcode compiler cache
on:
  pull_request:
    paths:
      - 'internal/xcodecache/**'
      - 'internal/artifact/**'
      - 'internal/cli/xcode.go'
      - 'internal/cli/run.go'
      - 'qa/xcode/**'
      - 'internal/access/snapshot*'
      - 'internal/config/snapshot*'
      - 'internal/server/snapshot*'
      - 'native/snapshot-auth*'
      - 'native/client.ts'
      - 'native/cli.ts'
      - 'native/dist/cli.js'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/xcode-cache.yml'
  push:
    branches: [main]
    paths:
      - 'internal/xcodecache/**'
      - 'internal/artifact/**'
      - 'internal/cli/xcode.go'
      - 'internal/cli/run.go'
      - 'qa/xcode/**'
      - 'internal/access/snapshot*'
      - 'internal/config/snapshot*'
      - 'internal/server/snapshot*'
      - 'native/snapshot-auth*'
      - 'native/client.ts'
      - 'native/cli.ts'
      - 'native/dist/cli.js'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/xcode-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xcode-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Cross-compile cache adapter on Linux
    runs-on: ${{ vars.LAYERCACHE_UBICLOUD_ENABLED == 'true' && github.run_attempt == 1 && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
      - run: go test -race ./internal/xcodecache/...
      - run: go test -race ./qa/xcode/pressure-proxy
      - name: Check standalone qualifier controls
        run: python3 qa/xcode/standalone-snapshot-probe.test.py
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/layercache" ./cmd/layercache
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/xcode-pressure-proxy" ./qa/xcode/pressure-proxy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-cache-adapter
          path: |
            ${{ runner.temp }}/layercache
            ${{ runner.temp }}/xcode-pressure-proxy
          if-no-files-found: error
          retention-days: 1
  qualify:
    name: Real Xcode cold, warm and pressure replay
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcode-cache-adapter
          path: ${{ runner.temp }}/xcode-adapter
      - run: chmod +x "$RUNNER_TEMP/xcode-adapter/layercache" "$RUNNER_TEMP/xcode-adapter/xcode-pressure-proxy"
      - name: Install the pinned project generator
        run: gem install --user-install xcodeproj --version 1.27.0 --no-document
      - name: Build with fresh consumers and forced quota eviction
        run: bash qa/xcode/probe.sh "$RUNNER_TEMP/xcode-adapter/layercache" "$RUNNER_TEMP/xcode-cache-evidence" "$RUNNER_TEMP/xcode-adapter/xcode-pressure-proxy"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xcode-cache-evidence
          path: |
            ${{ runner.temp }}/xcode-cache-evidence/*.log
            ${{ runner.temp }}/xcode-cache-evidence/*.json
            ${{ runner.temp }}/xcode-cache-evidence/toolchain.txt
          retention-days: 3
  standalone:
    name: Xcode 27 standalone scoped snapshot replay
    needs: build
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Select the installed release explicitly; the probe verifies actual facts.
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcode-cache-adapter
          path: ${{ runner.temp }}/xcode-adapter
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: chmod +x "$RUNNER_TEMP/xcode-adapter/layercache"
      - name: Install the pinned project generator
        run: gem install --user-install xcodeproj --version 1.27.0 --no-document
      - name: Publish closed store and replay in independent Clang consumer
        run: python3 qa/xcode/standalone-snapshot-probe.py "$RUNNER_TEMP/xcode-adapter/layercache" "$GITHUB_WORKSPACE/native/dist/cli.js" "$RUNNER_TEMP/xcode-standalone-evidence"
      - name: Upload only sanitized compiler and transfer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xcode-standalone-evidence
          path: |
            ${{ runner.temp }}/xcode-standalone-evidence/toolchain.json
            ${{ runner.temp }}/xcode-standalone-evidence/result.json
            ${{ runner.temp }}/xcode-standalone-evidence/transfer-audit.json
            ${{ runner.temp }}/xcode-standalone-evidence/producer-build.log
            ${{ runner.temp }}/xcode-standalone-evidence/consumer-build.log
            ${{ runner.temp }}/xcode-standalone-evidence/changed-build.log
            ${{ runner.temp }}/xcode-standalone-evidence/producer-disassembly.log
            ${{ runner.temp }}/xcode-standalone-evidence/consumer-disassembly.log
            ${{ runner.temp }}/xcode-standalone-evidence/changed-disassembly.log
            ${{ runner.temp }}/xcode-standalone-evidence/producer-stats.json
            ${{ runner.temp }}/xcode-standalone-evidence/consumer-stats.json
            ${{ runner.temp }}/xcode-standalone-evidence/changed-stats.json
            ${{ runner.temp }}/xcode-standalone-evidence/producer-closure.json
            ${{ runner.temp }}/xcode-standalone-evidence/consumer-closure.json
            ${{ runner.temp }}/xcode-standalone-evidence/changed-closure.json
            ${{ runner.temp }}/xcode-standalone-evidence/writer-archive.json
            ${{ runner.temp }}/xcode-standalone-evidence/reader-archive.json
          retention-days: 3
