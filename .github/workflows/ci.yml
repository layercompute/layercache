name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-client:
    name: Native cache / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.scope.outputs.mode != 'docs'
        with:
          node-version: '24.13.0'
      - run: npm install --global pnpm@10.34.5
        if: steps.scope.outputs.mode != 'docs'
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.mode != 'docs'
      - run: pnpm check
        if: steps.scope.outputs.mode != 'docs'
      - name: Test isolated execution observations
        if: steps.scope.outputs.mode != 'docs'
        run: node --test action/setup/execution.test.ts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.scope.outputs.mode != 'docs'
        with:
          go-version: '1.25.13'
          cache: false
      - name: Test native client against the installed server
        if: steps.scope.outputs.mode != 'docs'
        run: |
          go build -o "$RUNNER_TEMP/layercache-native-test" ./cmd/layercache
          LAYERCACHE_SETUP_BINARY="$RUNNER_TEMP/layercache-native-test" pnpm test
      - name: Qualify standalone compiler lifecycle and scoped snapshots
        if: steps.scope.outputs.mode != 'docs'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-native-test
          NATIVE_CACHE_CLI: ${{ github.workspace }}/native/dist/cli.js
          LAYER_CACHE_XCODE_LIFECYCLE_REPORT: ${{ runner.temp }}/xcode-lifecycle-evidence.json
        run: go test ./qa/xcode-lifecycle -run '^TestScopedClosedStoreRoundTrip$' -count=1 -v
      - name: Preserve sanitized lifecycle evidence
        if: (steps.scope.outputs.mode != 'docs') && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-lifecycle-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/xcode-lifecycle-evidence.json
          if-no-files-found: warn
          retention-days: 3
      - name: Gate candidate with real Nx native HTTP acceptance
        if: steps.scope.outputs.mode != 'docs'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-native-test
          NX_QA_OUTPUT: ${{ runner.temp }}/nx-native-evidence.json
        run: pnpm qa:nx-native
      - name: Preserve sanitized Nx evidence
        if: (steps.scope.outputs.mode != 'docs') && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nx-native-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/nx-native-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Gate the native Gradle protocol on Linux
        if: (steps.scope.outputs.mode != 'docs') && (runner.os == 'Linux')
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-native-test
          GRADLE_QA_OUTPUT: ${{ runner.temp }}/gradle-native-evidence.json
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 10 --max-time 120 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output "$RUNNER_TEMP/gradle-native.zip"
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  $RUNNER_TEMP/gradle-native.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-native.zip" -d "$RUNNER_TEMP/gradle-native"
          export JAVA_HOME="${JAVA_HOME_17_X64:?The native fixture requires JDK 17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_BIN="$RUNNER_TEMP/gradle-native/gradle-9.3.1/bin/gradle"
          pnpm qa:gradle-native
      - name: Preserve sanitized Gradle evidence
        if: (steps.scope.outputs.mode != 'docs') && (always() && runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-native-evidence-linux
          path: ${{ runner.temp }}/gradle-native-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Gate the native Bazel HTTP protocol on Linux
        if: (steps.scope.outputs.mode != 'docs') && (runner.os == 'Linux')
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-native-test
          BAZEL_QA_EVIDENCE: ${{ runner.temp }}/bazel-native-evidence.json
        run: node qa/bazel-native/run.mjs
      - name: Preserve sanitized Bazel evidence
        if: (steps.scope.outputs.mode != 'docs') && (always() && runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-native-evidence-linux
          path: ${{ runner.temp }}/bazel-native-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify shipped JavaScript matches TypeScript
        if: steps.scope.outputs.mode != 'docs'
        run: git diff --exit-code -- native/dist action/native/dist action/setup/execution-worker.cjs internal/dashboard/assets/app.js internal/portal/assets/app.js

  performance:
    name: Cache performance
    uses: ./.github/workflows/performance.yml

  dashboard:
    name: Dashboard / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.scope.outputs.mode != 'docs'
        with:
          node-version: '24.13.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.scope.outputs.mode != 'docs'
        with:
          go-version: '1.25.13'
          cache: false
      - run: npm install --global pnpm@10.34.5
        if: steps.scope.outputs.mode != 'docs'
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.mode != 'docs'
      - run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
        if: steps.scope.outputs.mode != 'docs'
      - run: pnpm typecheck && pnpm build
        if: steps.scope.outputs.mode != 'docs'
      - name: Build dashboard candidate
        if: steps.scope.outputs.mode != 'docs'
        run: go build -o "$RUNNER_TEMP/layercache-dashboard" ./cmd/layercache
      - name: Exercise real cache connections and browser failures
        if: steps.scope.outputs.mode != 'docs'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-dashboard
          DASHBOARD_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: ${{ runner.temp }}/dashboard-browser-results
        run: pnpm test:dashboard
      - name: Exercise self-serve cloud onboarding and team isolation
        if: steps.scope.outputs.mode != 'docs'
        env:
          LAYERCACHE_BIN: ${{ runner.temp }}/layercache-dashboard
          DASHBOARD_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: ${{ runner.temp }}/cloud-browser-results
        run: pnpm test:cloud
      - name: Preserve browser failure evidence
        if: failure() && steps.scope.outputs.mode != 'docs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/dashboard-browser-results/
            ${{ runner.temp }}/cloud-browser-results/
          if-no-files-found: ignore
          retention-days: 3

  lint:
    name: Workflow and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: false
      - name: Test conservative scope and Go cache profiles
        run: node --test .github/actions/ci-scope/*.test.mjs .github/actions/go-cache-profile/*.test.mjs
      - name: Install pinned lint tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
      - name: Check workflows, shell scripts, and whitespace
        run: bash qa/lint.sh

  linux-go:
    name: Go / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER_CACHE_QA_POSTGRES_URL: postgres://layercache:layercache@127.0.0.1:5432/layercache?sslmode=disable
      LAYERCACHE_MEASUREMENT_POSTGRES_URL: postgres://layercache:layercache@127.0.0.1:5432/layercache?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: layercache
          POSTGRES_PASSWORD: layercache
          POSTGRES_USER: layercache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layercache -d layercache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - name: Scope native Go compilation cache
        if: steps.scope.outputs.mode != 'docs'
        id: go-cache
        uses: ./.github/actions/go-cache-profile
      - name: Set up Go
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: ${{ steps.go-cache.outputs.enabled == 'true' }}
          cache-dependency-path: |
            go.sum
            .github/.go-cache-context

      - name: Remove owned Go cache profile before source builds
        if: always() && steps.go-cache.outputs.enabled == 'true'
        run: rm -f -- .github/.go-cache-context

      - name: Require native x64 runner
        if: steps.scope.outputs.mode != 'docs'
        run: test "$(uname -m)" = x86_64

      - name: Test
        if: steps.scope.outputs.mode != 'docs'
        run: go test ./... -count=1

      - name: Race detector
        if: steps.scope.outputs.mode != 'docs'
        run: go test -race ./... -count=1

      - name: Vet
        if: steps.scope.outputs.mode != 'docs'
        run: go vet ./...

      - name: Build Linux binary
        if: steps.scope.outputs.mode != 'docs'
        run: go build -trimpath -o /tmp/layercache ./cmd/layercache

      - name: Compile Linux arm64 binary
        if: steps.scope.outputs.mode != 'docs'
        env:
          CGO_ENABLED: "0"
          GOARCH: arm64
          GOOS: linux
        run: go build -trimpath -o /tmp/layercache-linux-arm64 ./cmd/layercache

  linux-arm-go:
    name: Go / Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - name: Scope native Go compilation cache
        if: steps.scope.outputs.mode != 'docs'
        id: go-cache
        uses: ./.github/actions/go-cache-profile
      - name: Set up Go
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: ${{ steps.go-cache.outputs.enabled == 'true' }}
          cache-dependency-path: |
            go.sum
            .github/.go-cache-context

      - name: Remove owned Go cache profile before source builds
        if: always() && steps.go-cache.outputs.enabled == 'true'
        run: rm -f -- .github/.go-cache-context

      - name: Require native arm64 runner
        if: steps.scope.outputs.mode != 'docs'
        run: test "$(uname -m)" = aarch64

      - name: Test
        if: steps.scope.outputs.mode != 'docs'
        run: go test ./... -count=1

      - name: Race detector
        if: steps.scope.outputs.mode != 'docs'
        run: go test -race ./... -count=1

      - name: Vet
        if: steps.scope.outputs.mode != 'docs'
        run: go vet ./...

      - name: Build Linux arm64 binary
        if: steps.scope.outputs.mode != 'docs'
        run: go build -trimpath -o /tmp/layercache ./cmd/layercache

  macos-go:
    name: Go / macOS arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - name: Scope native Go compilation cache
        if: steps.scope.outputs.mode != 'docs'
        id: go-cache
        uses: ./.github/actions/go-cache-profile
      - name: Set up Go
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.13"
          cache: ${{ steps.go-cache.outputs.enabled == 'true' }}
          cache-dependency-path: |
            go.sum
            .github/.go-cache-context

      - name: Remove owned Go cache profile before source builds
        if: always() && steps.go-cache.outputs.enabled == 'true'
        run: rm -f -- .github/.go-cache-context

      - name: Require native arm64 runner
        if: steps.scope.outputs.mode != 'docs'
        run: test "$(uname -m)" = arm64

      - name: Test on the selected macOS runner
        if: steps.scope.outputs.mode != 'docs'
        run: go test ./... -count=1

      - name: Repeat concurrent installation creation
        if: steps.scope.outputs.mode != 'docs'
        run: go test ./internal/executioncollect -run '^TestInstallationSeedConcurrentCreationAndPermissions$' -count=20

      - name: Vet
        if: steps.scope.outputs.mode != 'docs'
        run: go vet ./...

      - name: Build macOS binary
        if: steps.scope.outputs.mode != 'docs'
        run: go build -trimpath -o /tmp/layercache ./cmd/layercache

  cache-action:
    name: GitHub Action bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: action/cache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify CI changes
        id: scope
        uses: ./.github/actions/ci-scope
      - name: Set up Node.js
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13.0"

      - name: Install pinned pnpm
        if: steps.scope.outputs.mode != 'docs'
        run: npm install --global pnpm@10.34.5

      - name: Install locked dependencies
        if: steps.scope.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and verify checked-in bundles
        if: steps.scope.outputs.mode != 'docs'
        run: pnpm check

      - name: Require tracked, clean bundles
        if: steps.scope.outputs.mode != 'docs'
        run: |
          git ls-files --error-unmatch dist/main/index.js dist/main/package.json dist/post/index.js dist/post/package.json
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Test installer and runner setup
        if: steps.scope.outputs.mode != 'docs'
        working-directory: .
        run: node --test action/setup/setup.test.mjs action/gradle/*.test.mjs scripts/install.test.mjs
      - name: Check native TypeScript Turbo action
        if: steps.scope.outputs.mode != 'docs'
        working-directory: action/turbo
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Check native TypeScript BuildKit action
        if: steps.scope.outputs.mode != 'docs'
        working-directory: action/buildkit
        run: |
          pnpm install --frozen-lockfile
          pnpm check
